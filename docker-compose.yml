services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_initial_dbms_default__database: ${NEO4J_DATABASE}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  neo4j-mcp:
    image: mcp/neo4j
    container_name: neo4j-mcp
    ports:
      - "8080:8080"
    environment:
      NEO4J_MCP_TRANSPORT_MODE: http
      NEO4J_MCP_HTTP_HOST: 0.0.0.0
      NEO4J_MCP_HTTP_PORT: 8080
      NEO4J_MCP_HTTP_ALLOWED_URIS: neo4j:7687
    depends_on:
      - neo4j
    restart: unless-stopped

volumes:
  neo4j_data:
    #external: true
  neo4j_logs:
    #external: true